# Bluy — Nginx server block for a plain (non-panel) VPS.
#
# Install steps (run on the VPS):
#   1. Upload the CONTENTS of dist/ to /var/www/bluy
#   2. sudo cp nginx-bluy.conf /etc/nginx/sites-available/bluy
#   3. sudo ln -s /etc/nginx/sites-available/bluy /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. Add HTTPS:  sudo certbot --nginx -d your-domain.com -d www.your-domain.com
#      (certbot rewrites this file to add the :443 block and redirect)

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Folder containing index.html (the uploaded contents of dist/).
    root /var/www/bluy;
    index index.html;

    # SPA fallback: any route that isn't a real file serves index.html,
    # so the app's client-side router (e.g. /story/<id>) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache Expo's content-hashed static assets.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML entry so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
